name: CI

# PR と main への push で、型 / lint / 依存方向 / ドリフト / 単体テストを検証する。
# とくに COMPONENT_LOOKUP.md の再生成忘れ（ドリフト）を `npm run check` の
# `generate-component-lookup.mjs --check` で自動検知する。

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      # dist/ は git 追跡外のため、check 内の check-published-deps.mjs（dist/index.js を
      # 読む）より前にライブラリをビルドしておく
      - name: build:lib (dist 生成)
        run: npm run build:lib

      - name: tsc / lint-scratch / deps / drift / COMPONENT_LOOKUP --check
        run: npm run check

      # 配布物サイズの予算（contracts/bundle-size-budget.json）。エントリ別の gzip サイズと、
      # Button だけ import したときの tree-shaking 後サイズを測る。dist を使うので build:lib の後。
      # 予算超過でも上の check の結果が同じ run で見えるよう、check の後ろに置く。
      # CI では --update を使わない（予算を自動更新すると超過を検出できなくなる）。
      - name: Bundle size budget (配布物サイズ・tree-shaking 予算)
        run: npm run lint:bundle-size

      # mcp-server のテストは MCP SDK のクライアントで resources を読むため、
      # 単体テストより前に mcp-server の依存を入れておく
      - name: mcp-server 依存のインストール
        run: npm ci --prefix mcp-server

      # Unit tests の実ブラウザ回帰検証にも chromium が必要。
      - name: Playwright ブラウザのキャッシュ復元
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Playwright chromium のインストール
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Playwright の OS 依存パッケージのみ導入（キャッシュ命中時）
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Unit tests (vitest)
        run: npm test

      # ── 旧 Radix 回帰テスト（issue #516）──
      # DS 自身の node_modules は ref churn 修正済みの Radix を解決するため、
      # 上の `npm test` では consumer が古い Radix を掴んだときの回帰
      # （#516 の Maximum update depth exceeded）を原理的に再現できない。
      # belle-todo が実際に解決していた radix-ui@1.4.3 を専用ディレクトリへ
      # install し、その Radix でオーバーレイ面が収束することを検証する。
      - name: Legacy Radix regression tests (vitest / 旧 Radix 固定)
        run: npm run test:legacy-radix

      - name: Story reuse lint
        run: npm run lint:story-reuse

      # ── interaction テスト（Storybook play 関数 / issue #256）──
      # 押下でレイアウトが沈む・入場アニメーション中に操作不能、といった
      # v1.48.x で連続した種類の不具合をここで落とす。
      - name: Interaction tests (Storybook play / vitest browser)
        run: npm run test:interaction

      # ── a11y 機械検証（axe-core / issue #261）──
      # addon-a11y の afterEach フックが全ストーリーに対して axe-core を実行する
      # （vitest.a11y.config.ts、tags フィルタなし）。Playwright chromium は
      # 上の Unit tests より前に導入済み。
      - name: a11y tests (axe-core via Storybook / vitest browser)
        run: npm run test:a11y

      # ── 強制配色（forced-colors）モードのフォーカス表示検証（issue #620）──
      # CDP で forced-colors を有効化し、outline-hidden の Button がキーボード
      # フォーカス時に outline を出すことを実 chromium で確認する。Playwright
      # chromium は上の Unit tests より前に導入済み。
      - name: Forced-colors focus tests (vitest browser)
        run: npm run test:forced-colors

      - name: Packed package Web consumer install and build
        run: npm run test:consumer:web

      - name: Packed package Native consumer install and typecheck
        run: npm run test:consumer:native

      - name: Packed package Jest 29 consumer render
        run: npm run test:jest-consumer

      - name: mcp-server build (配布物 ksk-ds-mcp のコンパイル検証)
        run: npm run build --prefix mcp-server

  # ── WebKit（Safari 系）での play / axe ──
  # 上の check ジョブと同じ interaction / a11y テストを Playwright WebKit で回す。
  # Chromium では見えない差を拾うのが目的。直列に足すと CI が +5 分ほど伸びるため
  # 別ジョブにして check と並列に走らせる（storybook テストは build:lib 不要）。
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Playwright webkit のインストール
        run: npx playwright install --with-deps webkit

      - name: Interaction tests (WebKit)
        run: npm run test:interaction:webkit

      # 前のステップが落ちても a11y の結果は取る（原因の切り分けを 1 回の実行で済ませる）
      - name: a11y tests (WebKit)
        if: ${{ !cancelled() }}
        run: npm run test:a11y:webkit

  # 将来 branch protection の必須 check にする集約ジョブ。上のジョブのどれかが
  # 失敗・中止（または未実行のまま）なら落ちる。ジョブを足したら needs にも足すこと。
  ci-result:
    name: CI result
    if: ${{ always() }}
    needs: [check, webkit]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::必須の検査が成功していない（$r）"
              exit 1
            fi
          done
