name: Codex Review Receipt

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  receipt:
    # Codex のレビュー利用枠が枯渇している期間は、リポジトリ変数 CODEX_RECEIPT_DISABLED=true で
    # スキップできる（10分タイムアウトの恒常赤で信号が死ぬのを防ぐ）。枠回復後は変数を削除して再有効化する:
    #   gh variable delete CODEX_RECEIPT_DISABLED -R ekusiek716/ksk-design-system
    if: github.event.pull_request.draft == false && vars.CODEX_RECEIPT_DISABLED != 'true'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    # The public reusable workflow is pinned to an audited immutable commit.
    uses: ekusiek716/.github/.github/workflows/codex-review-receipt.yml@632bee09e15c9a66ae154ba912bb22325de703be

