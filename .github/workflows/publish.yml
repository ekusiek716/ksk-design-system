name: Publish

# npm Trusted Publishing (OIDC) による自動 publish。
# ローカルの npm トークンは不要（失効の概念がない）。
# main に package.json の version 変更が届いたとき、npm 上の最新版と比較して
# 新しければ publish する。手動実行 (workflow_dispatch) も可。
#
# 前提: npmjs.com の ksk-design-system パッケージ設定で Trusted Publisher に
# このリポジトリ (ekusiek716/ksk-design-system) + workflow "publish.yml" を登録しておくこと。
#
# 権限の分け方（issue #801）:
#   公開権限（id-token: write）と書き込み権限（contents: write）を持つ job では、
#   依存のインストールやビルド（= 外部ライブラリのコード）を一切動かさない。
#   依存のコードが OIDC トークンや contents: write のトークンに触れられないようにする
#   （トークンを盗んで任意の版を公開する・タグや Release を書き換える経路を断つ）ため。
#   - build job（読み取りだけ）: 版の判定 → npm ci --ignore-scripts → build:lib → npm pack
#     → tarball を artifact に上げる
#   - publish job（公開・書き込み）: リポジトリを checkout せず、artifact の tarball を
#     `npm publish <tgz> --ignore-scripts` で公開し、検証とタグ/Release 作成だけを行う
#   この分け方は __tests__/publish-workflow-permissions.test.ts が固定している。
#
#   範囲外: build job では依存のコードが引き続き動くので、build:lib や npm pack に細工できる
#   乗っ取り依存は、中身を改ざんした tarball を作れる（publish job は版の一致しか見ない）。
#   tarball の中身の完全性は lockfile の固定や dist 内容の検査など別の防御が担う。
#
# 再実行（issue #801 レビュー指摘）:
#   GitHub の「Re-run failed jobs」で publish job だけを再実行すると、build job の出力
#   （publish=true）は前回のものが再利用される。そこで publish job は自分でも npm 上の有無を
#   確かめ、公開済みなら Download / Publish を飛ばして Verify と Release 作成へ進む
#   （#269 / v2.5.0 で直した「publish は成功・タグ/Release だけ未作成」からの復旧を、
#   artifact の保持期限 1 日を過ぎた再実行でも効かせるため）。

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 既定は読み取りだけ。書き込み権限は publish job にだけ job 単位で付ける（issue #801）。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 認証情報を .git/config に残さない（この job は push しない）
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Check exact version and monotonicity
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          LATEST=$(npm view ksk-design-system version)
          echo "local=$LOCAL latest=$LATEST"
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          if npm view "ksk-design-system@$LOCAL" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            node - "$LOCAL" "$LATEST" <<'NODE'
          const [local, latest] = process.argv.slice(2)
          const parse = (value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value)
            if (!match) throw new Error(`stable semver only: ${value}`)
            return match.slice(1).map(Number)
          }
          const compare = (a, b) => {
            for (let i = 0; i < 3; i += 1) {
              if (a[i] !== b[i]) return a[i] - b[i]
            }
            return 0
          }
          if (compare(parse(local), parse(latest)) <= 0) {
            throw new Error(`refusing non-monotonic publish: ${local} <= ${latest}`)
          }
          NODE
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # 依存の install スクリプトは実行しない（esbuild・rollup はオプション依存の
      # プラットフォーム別パッケージのバイナリで動くので、install スクリプト無しでも build:lib が通る）。
      - name: Install
        if: steps.version.outputs.publish == 'true'
        run: npm ci --ignore-scripts

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build:lib

      # prepack（= build:lib）は直前で済ませているので --ignore-scripts で二重実行しない。
      - name: Pack
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACK_DIR="$RUNNER_TEMP/package"
          mkdir -p "$PACK_DIR"
          npm pack --ignore-scripts --pack-destination "$PACK_DIR"
          TARBALL="$PACK_DIR/ksk-design-system-$VERSION.tgz"
          test -f "$TARBALL"
          tar -tzf "$TARBALL" | grep -q 'package/dist/types/index.d.ts'
          tar -tzf "$TARBALL" | grep -q 'package/src/themes/default.css'

      - name: Upload tarball
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package/ksk-design-system-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    # publish=false（npm に該当版が既にある）でもこの job は走らせる。
    # 下の「Create git tag + GitHub Release」を、publish 済みでタグ/Release だけ未作成の
    # 再実行でも動かすため（#269）。公開系のステップだけを publish=true で絞る。
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # git tag + GitHub Release 作成に必須
      id-token: write # OIDC トークン発行に必須（Trusted Publishing の要）
    # リポジトリは checkout しない。この job が扱うのは build job の tarball だけで、
    # 依存のインストール・ビルド・リポジトリ内スクリプトを実行しない（issue #801）。
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # npm >= 11.5.1 が Trusted Publishing に必須
          registry-url: https://registry.npmjs.org

      # 「Re-run failed jobs」では build job の publish=true が再利用されるので、ここで
      # npm 上の有無を改めて確かめる。公開済みなら Download / Publish を飛ばす
      # （公開済みの版の再 publish で落ちて Release 作成に届かない・artifact の期限切れで
      # Download が落ちる、を防ぐ）。npm view が失敗したときは未公開として扱い、
      # 本当に公開済みなら npm publish 側が拒否して止まる（安全側）。
      - name: Check registry
        id: registry
        if: needs.build.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$(npm view "ksk-design-system@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "ksk-design-system@$VERSION is already on npm; skipping download and publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download tarball
        if: needs.build.outputs.publish == 'true' && steps.registry.outputs.published != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package

      - name: Publish tarball
        if: needs.build.outputs.publish == 'true' && steps.registry.outputs.published != 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TARBALL="$RUNNER_TEMP/package/ksk-design-system-$VERSION.tgz"
          # 取り違え防止: tarball の中の版が build job の判定した版と一致することを確かめる
          PACKED=$(tar -xzOf "$TARBALL" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          if [ "$PACKED" != "$VERSION" ]; then
            echo "tarball version $PACKED does not match $VERSION" >&2
            exit 1
          fi
          npm publish "$RUNNER_TEMP/package/ksk-design-system-$VERSION.tgz" --ignore-scripts

      - name: Verify registry metadata and tarball
        if: needs.build.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PACK_DIR="$(mktemp -d)"
          TARBALL="$PACK_DIR/ksk-design-system-$VERSION.tgz"
          # npm view が新バージョンを返しても、tarball の解決はワンテンポ遅れることがある
          # （v1.48.0 で実際に npm pack が ETARGET になり、後続のタグ作成まで落ちた）。
          # metadata と tarball の両方が引けるまでを 1 つのリトライにまとめる。
          #
          # 待ち時間は 12回×5秒（60秒）では足りない。v2.5.0 の publish で npm が
          # 「Your package is being processed and may take a few minutes to become
          # available.」を返し、60秒では登録が見えず Verify が落ちた（publish 自体は
          # 成功しており、タグ/Release だけが作られない半端な状態になった）。
          # npm の告知どおり数分かかりうるので 36回×10秒（6分）まで待つ。
          for attempt in $(seq 1 36); do
            if [ "$(npm view "ksk-design-system@$VERSION" version 2>/dev/null || true)" = "$VERSION" ] \
              && npm pack "ksk-design-system@$VERSION" --ignore-scripts --pack-destination "$PACK_DIR" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = 36 ]; then
              echo "registry did not expose $VERSION in time" >&2
              npm view "ksk-design-system@$VERSION" version || true
              npm pack "ksk-design-system@$VERSION" --ignore-scripts --pack-destination "$PACK_DIR" || true
              exit 1
            fi
            sleep 10
          done
          npm view "ksk-design-system@$VERSION" version dist.integrity --json
          tar -tzf "$TARBALL" | grep -q 'package/dist/types/index.d.ts'
          tar -tzf "$TARBALL" | grep -q 'package/src/themes/default.css'

      - name: Create git tag + GitHub Release
        # ゲートを「publish した場合のみ」から「Release がまだ無ければ作る」に変更する
        # （issue #269 レビュー指摘）。
        #
        # 旧ロジックは `if: steps.version.outputs.publish == 'true'` で、npm publish 自体は
        # 過去の run で成功したがこのステップだけ失敗した場合、再実行すると
        # 「npm に該当 version が既にある → publish=false」と判定されてこのステップごと
        # スキップされ、タグ/Release が永久に作られなくなる不具合があった。
        #
        # publish の成否に関わらずこのステップ自体は毎回実行し、冪等性は
        # 「対象タグの GitHub Release が既に存在するか」だけで判定する
        # （`gh release view` が成功したら何もしない）。tag の有無では分岐しない:
        # `gh release create` はタグが無ければ対象コミットにタグを作って Release も作り、
        # タグが既にあればそれを使って Release だけ作るため、
        # 「タグは存在するが Release だけ無い」状態（旧ロジックがタグ存在だけで
        # 早期 exit していたために取り残していたケース）もここで解消される。
        #
        # checkout しないので、対象リポジトリは GH_REPO で渡す（issue #801）。
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping"
            exit 0
          fi
          gh release create "$TAG" --generate-notes --target "$GITHUB_SHA"
