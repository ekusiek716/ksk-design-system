name: Publish

# npm Trusted Publishing (OIDC) による自動 publish。
# ローカルの npm トークンは不要（失効の概念がない）。
# main に package.json の version 変更が届いたとき、npm 上の最新版と比較して
# 新しければ publish する。手動実行 (workflow_dispatch) も可。
#
# 前提: npmjs.com の ksk-design-system パッケージ設定で Trusted Publisher に
# このリポジトリ (ekusiek716/ksk-design-system) + workflow "publish.yml" を登録しておくこと。

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # git tag + GitHub Release 作成に必須
  id-token: write # OIDC トークン発行に必須（Trusted Publishing の要）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # npm >= 11.5.1 が Trusted Publishing に必須
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check exact version and monotonicity
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          LATEST=$(npm view ksk-design-system version)
          echo "local=$LOCAL latest=$LATEST"
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          if npm view "ksk-design-system@$LOCAL" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            node - "$LOCAL" "$LATEST" <<'NODE'
          const [local, latest] = process.argv.slice(2)
          const parse = (value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value)
            if (!match) throw new Error(`stable semver only: ${value}`)
            return match.slice(1).map(Number)
          }
          const compare = (a, b) => {
            for (let i = 0; i < 3; i += 1) {
              if (a[i] !== b[i]) return a[i] - b[i]
            }
            return 0
          }
          if (compare(parse(local), parse(latest)) <= 0) {
            throw new Error(`refusing non-monotonic publish: ${local} <= ${latest}`)
          }
          NODE
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      - name: Publish (prepack が build:lib を実行)
        if: steps.version.outputs.publish == 'true'
        run: npm publish

      - name: Verify registry metadata and tarball
        if: steps.version.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACK_DIR="$(mktemp -d)"
          TARBALL="$PACK_DIR/ksk-design-system-$VERSION.tgz"
          # npm view が新バージョンを返しても、tarball の解決はワンテンポ遅れることがある
          # （v1.48.0 で実際に npm pack が ETARGET になり、後続のタグ作成まで落ちた）。
          # metadata と tarball の両方が引けるまでを 1 つのリトライにまとめる。
          for attempt in $(seq 1 12); do
            if [ "$(npm view "ksk-design-system@$VERSION" version 2>/dev/null || true)" = "$VERSION" ] \
              && npm pack "ksk-design-system@$VERSION" --ignore-scripts --pack-destination "$PACK_DIR" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "registry did not expose $VERSION in time" >&2
              npm view "ksk-design-system@$VERSION" version || true
              npm pack "ksk-design-system@$VERSION" --ignore-scripts --pack-destination "$PACK_DIR" || true
              exit 1
            fi
            sleep 5
          done
          npm view "ksk-design-system@$VERSION" version dist.integrity --json
          tar -tzf "$TARBALL" | grep -q 'package/dist/types/index.d.ts'
          tar -tzf "$TARBALL" | grep -q 'package/src/themes/default.css'

      - name: Create git tag + GitHub Release
        # ゲートを「publish した場合のみ」から「Release がまだ無ければ作る」に変更する
        # （issue #269 レビュー指摘）。
        #
        # 旧ロジックは `if: steps.version.outputs.publish == 'true'` で、npm publish 自体は
        # 過去の run で成功したがこのステップだけ失敗した場合、再実行すると
        # 「npm に該当 version が既にある → publish=false」と判定されてこのステップごと
        # スキップされ、タグ/Release が永久に作られなくなる不具合があった。
        #
        # publish の成否に関わらずこのステップ自体は毎回実行し、冪等性は
        # 「対象タグの GitHub Release が既に存在するか」だけで判定する
        # （`gh release view` が成功したら何もしない）。tag の有無では分岐しない:
        # `gh release create` はタグが無ければ対象コミットにタグを作って Release も作り、
        # タグが既にあればそれを使って Release だけ作るため、
        # 「タグは存在するが Release だけ無い」状態（旧ロジックがタグ存在だけで
        # 早期 exit していたために取り残していたケース）もここで解消される。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping"
            exit 0
          fi
          gh release create "$TAG" --generate-notes --target "$GITHUB_SHA"
